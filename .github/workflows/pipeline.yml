name: Newspaper OCR & Vector Pipeline (CI side)

# Cloudflare on tradingref.com reliably blocks GitHub's datacenter IPs (see
# repo history), so scraping happens LOCALLY (local_scrape_and_notify.py, on
# a residential IP) and uploads PDFs to Google Drive. This workflow only
# handles the heavy, Cloudflare-free part: fetch from Drive -> OCR -> Mongo
# -> Pinecone.
on:
  repository_dispatch:
    types: [newspaper-scraped]   # fired instantly by local_scrape_and_notify.py
  schedule:
    - cron: '0 3 * * *'          # 08:30 AM IST fallback, in case the dispatch didn't fire
  workflow_dispatch: {}          # manual "Run workflow" button

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies (OpenCV/PDF libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline (Drive fetch -> OCR -> MongoDB -> Pinecone)
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          # Keep PaddleOCR/OpenMP from over-subscribing the runner's CPU
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          FLAGS_allocator_strategy: "naive_best_fit"
          # The runner's CPU lacks the instruction set oneDNN's fused
          # self-attention kernel assumes, which SIGILLs otherwise (see repo
          # history) - disable oneDNN for CI runs only.
          OCR_DISABLE_MKLDNN: "1"
        run: python run_process_only_cli.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-debug-${{ github.run_id }}
          path: |
            temp_downloads/
          if-no-files-found: ignore
          retention-days: 5
