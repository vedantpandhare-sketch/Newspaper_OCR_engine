name: Marathi Newspaper Parallel OCR Pipeline

on:
  schedule:
    # Runs at 07:00 AM IST (01:30 AM UTC) every day after local scraper finishes
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  ocr-process:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies for OpenCV & PyMuPDF
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install paddlepaddle paddleocr PyMuPDF opencv-python numpy google-api-python-client google-auth-httplib2 google-auth-oauthlib

    - name: Fetch PDF from Google Drive
      env:
        GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      run: |
        python -c "
        import os, json
        # Reconstruct token/credentials from GitHub Secrets
        if not os.path.exists('token.json') and os.environ.get('GDRIVE_CREDENTIALS'):
            with open('token.json', 'w') as f:
                f.write(os.environ['GDRIVE_CREDENTIALS'])
        "
        # Download the latest PDF from Drive
        python -c "
        from drive_utils import download_latest_pdf_from_drive
        download_latest_pdf_from_drive(folder_id='1fFMtXqlTyP7gZtJ0L39l1IcJE0Wh5vRf', output_path='latest_newspaper.pdf')
        "

    - name: Run 4-Core Parallelized OCR Pipeline
      run: |
        python -c "
        from ocr_pipeline import MarathiNewspaperTwoDimPipeline
        import json, os

        pdf_file = 'latest_newspaper.pdf'
        if os.path.exists(pdf_file):
            pipeline = MarathiNewspaperTwoDimPipeline()
            results = pipeline.process_pdf(pdf_file)
            
            with open('extracted_articles.json', 'w', encoding='utf-8') as f:
                json.dump(results, f, ensure_ascii=False, indent=4)
            print('[Success] Parallel OCR completed successfully!')
        "

    - name: Upload Output JSON Artifact
      uses: actions/upload-artifact@v4
      with:
        name: extracted-marathi-articles
        path: extracted_articles.json