name: Daily Newspaper Scraper & PaddleOCR Pipeline

on:
  schedule:
    # Runs daily at 01:30 UTC (7:00 AM IST)
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual trigger button in GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Speeds up subsequent workflow runs

      - name: Install System Dependencies for PaddleOCR & Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils libgl1-mesa-glx libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          npx playwright install chromium --with-deps

      - name: Execute Full Automation (Scraper -> PaddleOCR -> MongoDB)
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          # Prevent OpenMP and Paddle from over-subscribing CPU threads
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          FLAGS_allocator_strategy: "naive_best_fit"
        run: |
          python main.py