name: Daily Newspaper Scraper Pipeline

on:
  schedule:
    # Runs daily at 01:30 UTC (7:00 AM IST)
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Install Playwright Browsers & System Dependencies
        run: |
          npx playwright install --with-deps chromium

      - name: Execute Scraper & Drive Upload
        env:
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
        run: |
          python scraper.py